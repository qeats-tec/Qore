<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qore // Cryptographic Network</title>
    <link rel="stylesheet" href="/style.css">
    
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#00ff66">
    <meta name="apple-mobile-web-app-capable" content="yes">
</head>
<body>

    <div id="setup-container" class="auth-wrapper">
        <div class="auth-box">
            <div class="auth-header">
                <div class="glitch-logo">QORE // NETWORK</div>
                <p id="auth-subtitle">Sisteme erişim sağlamak için kimlik doğrulaması yapın.</p>
            </div>
            
            <div class="auth-tabs">
                <button id="tab-login" class="tab-btn active">GİRİŞ YAP</button>
                <button id="tab-register" class="tab-btn">KAYIT OL</button>
            </div>

            <div id="login-form-area" class="auth-form">
                <div class="input-group">
                    <label>SİBER KİMLİK (USER)</label>
                    <input type="text" id="login-username" placeholder="Kullanıcı adınızı girin..." autocomplete="off">
                </div>
                <div class="input-group">
                    <label>ERİŞİM ANAHTARI (PASS)</label>
                    <input type="password" id="login-password" placeholder="••••••••">
                </div>
                <button id="login-submit-btn" class="cyber-btn">SİSTEME SIZ</button>
            </div>

            <div id="register-form-area" class="auth-form hidden">
                <div class="input-group">
                    <label>YENİ KİMLİK TANIMI</label>
                    <input type="text" id="register-username" placeholder="Benzersiz bir ad seçin..." autocomplete="off">
                </div>
                <div class="input-group">
                    <label>GÜVENLİK ŞİFRESİ</label>
                    <input type="password" id="register-password" placeholder="Güçlü bir şifre girin...">
                </div>
                <button id="register-submit-btn" class="cyber-btn register">VERİTABANINA İŞLE</button>
            </div>
        </div>
    </div>

    <div id="main-wrapper" class="hidden">
        <aside class="side-panel">
            <div class="panel-section">
                <h3>// KANALLAR</h3>
                <ul id="room-list" class="cyber-list"></ul>
                <div class="create-room-wrapper">
                    <input type="text" id="new-room-input" placeholder="Oda adı..." autocomplete="off">
                    <button id="create-room-btn">+</button>
                </div>
            </div>
            <div class="panel-section">
                <h3>// AKTİF KULLANICILAR</h3>
                <ul id="user-list" class="cyber-list users"></ul>
            </div>
            <button id="open-settings-btn" class="profile-settings-trigger">⚙️ PROFİLİMİ DÜZENLE</button>
        </aside>

        <main class="chat-area">
            <header class="chat-header">
                <h2 id="current-room-title">Qore // Genel</h2>
            </header>
            
            <div id="messages-display" class="messages-container"></div>
            
            <div id="typing-indicator" class="typing-text hidden">biri yazıyor...</div>

            <form id="chat-form" class="chat-input-wrapper">
                <input type="text" id="message-input" placeholder="Matrise bir mesaj gönder..." autocomplete="off">
                <button type="submit" class="send-btn">GÖNDER</button>
            </form>
        </main>
    </div>

    <div id="settings-modal" class="modal hidden">
        <div class="modal-content">
            <h3>// PROFİL ALTYAPISINI GÜNCELLE</h3>
            <div class="avatar-edit-wrapper">
                <img id="avatar-preview" src="https://www.w3schools.com/howto/img_avatar.png" alt="Önizleme">
                <input type="file" id="settings-avatar-file" accept="image/png, image/jpeg">
            </div>
            <div class="input-group">
                <label>DURUM SİNYALİ</label>
                <select id="settings-status">
                    <option value="online">Çevrimiçi (Online)</option>
                    <option value="idle">Boşta (Idle)</option>
                    <option value="dnd">Rahatsız Etmeyin (DND)</option>
                </select>
            </div>
            <div class="input-group">
                <label>BİYOGRAFİ (BIO)</label>
                <textarea id="settings-bio" rows="3" placeholder="Kendinden bahset..."></textarea>
            </div>
            
            <div class="input-group">
                <label>SİBER TEMA RENGİ (NEON COLOR)</label>
                <div class="color-picker-wrapper">
                    <input type="color" id="settings-theme-color" value="#00ff66">
                    <span id="color-hex-text">#00ff66</span>
                </div>
            </div>

            <div class="modal-actions">
                <button id="save-settings-btn" class="cyber-btn text-btn">KAYDET</button>
                <button id="close-settings-btn" class="cyber-btn text-btn cancel">İPTAL</button>
            </div>
        </div>
    </div>

    <div id="user-profile-modal" class="modal hidden">
        <div class="modal-content profile-view">
            <div class="profile-view-header">
                <img id="view-user-avatar" src="" alt="PP">
                <h3 id="view-user-name">Kullanıcı</h3>
                <span id="view-user-status" class="status-tag">Online</span>
            </div>
            <div class="profile-view-body">
                <label>// SİBER BİYOGRAFİ</label>
                <p id="view-user-bio">Yükleniyor...</p>
            </div>
            <button id="close-user-modal-btn" class="cyber-btn text-btn">PANELİ KAPAT</button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/client.js"></script>
</body>
</html>
