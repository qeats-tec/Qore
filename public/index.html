<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qore // Connect & Chat</title>
    <link rel="stylesheet" href="/style.css">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#00ff66">
    <meta name="mobile-web-app-capable" content="yes">
</head>
<body>

    <div id="setup-container" class="auth-wrapper">
        <div class="auth-box">
            <div class="auth-header">
                <div class="glitch-logo">QORE</div>
                <p id="auth-subtitle">Devam etmek için lütfen hesabınıza giriş yapın veya yeni bir hesap oluşturun.</p>
            </div>
            
            <div class="auth-tabs">
                <button id="tab-login" class="tab-btn active">GİRİŞ YAP</button>
                <button id="tab-register" class="tab-btn">KAYIT OL</button>
            </div>

            <div id="login-form-area" class="auth-form">
                <div class="input-group">
                    <label>KULLANICI ADI</label>
                    <input type="text" id="login-username" placeholder="Kullanıcı adınızı girin..." autocomplete="off">
                </div>
                <div class="input-group">
                    <label>ŞİFRE</label>
                    <input type="password" id="login-password" placeholder="••••••••">
                </div>
                <button id="login-submit-btn" class="cyber-btn">GİRİŞ YAP</button>
            </div>

            <div id="register-form-area" class="auth-form hidden">
                <div class="input-group">
                    <label>KULLANICI ADI</label>
                    <input type="text" id="register-username" placeholder="Benzersiz bir kullanıcı adı seçin..." autocomplete="off">
                </div>
                <div class="input-group">
                    <label>ŞİFRE</label>
                    <input type="password" id="register-password" placeholder="Güçlü bir şifre belirleyin...">
                </div>
                <button id="register-submit-btn" class="cyber-btn register">HESABI OLUŞTUR</button>
            </div>
        </div>
    </div>

    <div id="main-wrapper" class="hidden">
        <!-- Sol Panel -->
        <aside id="side-panel" class="side-panel">
            <div class="panel-section">
                <h3>KANALLAR</h3>
                <ul id="room-list" class="cyber-list"></ul>
            </div>
            <div class="panel-section">
                <h3>ÇEVRİMİÇİ KULLANICILAR</h3>
                <ul id="user-list" class="cyber-list users"></ul>
            </div>
            <div class="side-panel-actions">
                <button id="open-settings-btn" class="profile-settings-trigger">⚙️ PROFİLİ DÜZENLE</button>
                <button id="logout-btn" class="profile-settings-trigger logout-override">❌ OTURUMU KAPAT</button>
            </div>
        </aside>

        <!-- Sağ Chat Alanı -->
        <main class="chat-area">
            <header class="chat-header">
                <!-- Mobil Hamburger Menü Butonu -->
                <button id="menu-toggle-btn" class="menu-btn">☰</button>
                <h2 id="current-room-title">Qore // Genel</h2>
            </header>
            
            <div id="messages-display" class="messages-container"></div>
            
            <div id="typing-indicator" class="typing-text hidden">biri yazıyor...</div>

            <form id="chat-form" class="chat-input-wrapper">
                <input type="text" id="message-input" placeholder="Bir mesaj yazın..." autocomplete="off">
                <button type="submit" class="send-btn">GÖNDER</button>
            </form>
        </main>
    </div>

    <!-- Kendi Ayarlar Modalı -->
    <div id="settings-modal" class="modal hidden">
        <div class="modal-content">
            <h3>PROFİL AYARLARI</h3>
            <div class="avatar-edit-wrapper">
                <img id="avatar-preview" src="https://www.w3schools.com/howto/img_avatar.png" alt="Önizleme">
                <input type="file" id="settings-avatar-file" accept="image/png, image/jpeg">
            </div>
            <div class="input-group">
                <label>DURUM</label>
                <select id="settings-status">
                    <option value="online">Çevrimiçi</option>
                    <option value="idle">Boşta</option>
                    <option value="dnd">Rahatsız Etmeyin</option>
                </select>
            </div>
            <div class="input-group">
                <label>BİYOGRAFİ</label>
                <textarea id="settings-bio" rows="3" placeholder="Kendinizden bahsedin..."></textarea>
            </div>
            
            <div class="input-group">
                <label>ARAYÜZ VURGU RENGİ</label>
                <div class="color-picker-wrapper">
                    <input type="color" id="settings-theme-color" value="#00ff66">
                    <span id="color-hex-text">#00ff66</span>
                </div>
            </div>

            <div class="modal-actions">
                <button id="save-settings-btn" class="cyber-btn text-btn">DEĞİŞİKLİKLERİ KAYDET</button>
                <button id="close-settings-btn" class="cyber-btn text-btn cancel">İPTAL</button>
            </div>
        </div>
    </div>

    <!-- Başkasının Profili Modalı -->
    <div id="user-profile-modal" class="modal hidden">
        <div class="modal-content profile-view">
            <div class="profile-view-header">
                <img id="view-user-avatar" src="" alt="Profil Resmi">
                <h3 id="view-user-name">Kullanıcı</h3>
                <span id="view-user-status" class="status-tag">Çevrimiçi</span>
            </div>
            <div class="profile-view-body">
                <label>BİYOGRAFİ</label>
                <p id="view-user-bio">Yükleniyor...</p>
            </div>
            <div class="modal-actions" style="flex-direction: column; gap: 8px;">
                <button id="start-dm-btn" class="cyber-btn" style="width: 100%;">💬 MESAJ GÖNDER (DM)</button>
                <button id="close-user-modal-btn" class="cyber-btn text-btn cancel" style="width: 100%;">KAPAT</button>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/client.js"></script>
</body>
</html>
